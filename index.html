<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Что в холодильнике?</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        margin: 0;
        padding: 16px;
      }

      h2 {
        margin-top: 0;
      }

      .ingredient-label {
        display: flex;
        align-items: center;
        padding: 12px;
        margin-bottom: 8px;
        background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 10px;
        cursor: pointer;
      }

      .ingredient-label input[type="checkbox"] {
        margin-right: 12px;
        transform: scale(1.3);
      }

      .recipe-card {
        background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }

      .recipe-title {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 8px;
      }
      .recipe-match {
        color: var(--tg-theme-hint-color, #999999);
        font-size: 14px;
      }
      .hidden {
        display: none !important;
      }

      /* Стили для спойлера с рецептом */
      details {
        margin-top: 12px;
      }
      summary {
        color: var(--tg-theme-link-color, #3390ec);
        font-weight: 600;
        cursor: pointer;
        outline: none;
        padding: 4px 0;
      }
      ol {
        padding-left: 20px;
        margin-top: 8px;
        margin-bottom: 0;
        color: var(--tg-theme-text-color, #000000);
        font-size: 15px;
        line-height: 1.4;
      }
      li {
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div id="ingredients-screen">
      <h2>Что есть в холодильнике? 🧊</h2>
      <div id="ingredients-list"></div>
    </div>

    <div id="recipes-screen" class="hidden">
      <h2>Подходящие рецепты 🍳</h2>
      <div id="recipes-list"></div>
      <button
        onclick="showIngredientsScreen()"
        style="
          margin-top: 16px;
          padding: 12px;
          width: 100%;
          border-radius: 8px;
          border: none;
          background: var(--tg-theme-button-color, #3390ec);
          color: var(--tg-theme-button-text-color, #fff);
          font-weight: bold;
          font-size: 16px;
        "
      >
        Выбрать другие продукты
      </button>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      const AVAILABLE_INGREDIENTS = [
        { id: 1, name: "Яйца 🥚" },
        { id: 3, name: "Масло 🧈" },
        { id: 4, name: "Мука 🌾" },
        { id: 5, name: "Картошка 🥔" },
        { id: 6, name: "Лук 🧅" },
        { id: 7, name: "Курица 🍗" },
        { id: 8, name: "Макароны 🍝" },
        { id: 9, name: "Сыр 🧀" },
        { id: 10, name: "Молоко 🥛" },
        { id: 11, name: "Морковь 🥕" },
        { id: 12, name: "Чеснок 🧄" },
        { id: 13, name: "Рис 🍚" },
        { id: 15, name: "Мясной фарш 🥩" },
        { id: 16, name: "Сметана 🥣" },
        { id: 17, name: "Капуста 🥬" },
        { id: 18, name: "Болгарский перец 🫑" },
        { id: 19, name: "Огурцы 🥒" },
        { id: 20, name: "Зелень 🌿" },
        { id: 21, name: "Ветчина 🥓" },
        { id: 22, name: "Свинина 🥩" }, // Новое
        { id: 23, name: "Гречка 🟤" }, // Новое
        { id: 24, name: "Говядина 🥩" }, // Новое
      ];

      let selectedIngredients = new Set();

      function renderIngredients() {
        const listContainer = document.getElementById("ingredients-list");
        AVAILABLE_INGREDIENTS.forEach((ingredient) => {
          const label = document.createElement("label");
          label.className = "ingredient-label";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = ingredient.id;

          checkbox.addEventListener("change", (e) => {
            if (e.target.checked) selectedIngredients.add(ingredient.id);
            else selectedIngredients.delete(ingredient.id);
            updateButtons();
          });

          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(ingredient.name));
          listContainer.appendChild(label);
        });
      }

      function updateButtons() {
        if (selectedIngredients.size > 0) {
          tg.MainButton.text = `Найти рецепты (${selectedIngredients.size})`;
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }

      async function performSearch() {
        if (
          !document
            .getElementById("recipes-screen")
            .classList.contains("hidden")
        )
          return;
        tg.MainButton.showProgress();

        try {
          // ВАЖНО: Убедитесь, что тут стоит ВАША ссылка на Render!
          const response = await fetch(
            "https://fridge-api-a3wl.onrender.com/api/find-recipes",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ingredient_ids: Array.from(selectedIngredients),
              }),
            },
          );

          if (!response.ok) throw new Error("Ошибка сервера");

          const data = await response.json();
          renderRecipes(data.recipes);

          document.getElementById("ingredients-screen").classList.add("hidden");
          document.getElementById("recipes-screen").classList.remove("hidden");
          tg.MainButton.hide();
        } catch (error) {
          tg.showAlert("Ошибка: " + error.message);
        } finally {
          tg.MainButton.hideProgress();
        }
      }

      tg.MainButton.onClick(performSearch);

      function renderRecipes(recipes) {
        const listContainer = document.getElementById("recipes-list");
        listContainer.innerHTML = "";

        if (recipes.length === 0) {
          listContainer.innerHTML =
            '<p style="text-align:center;">Ничего не найдено 😔</p>';
          return;
        }

        recipes.forEach((recipe) => {
          const card = document.createElement("div");
          card.className = "recipe-card";

          const stepsHtml = (recipe.steps || [])
            .map((step) => `<li>${step}</li>`)
            .join("");

          // Проверяем, есть ли недостающие продукты
          const missingText =
            recipe.missing_ingredients && recipe.missing_ingredients.length > 0
              ? `<div class="recipe-match" style="color: #e53935; margin-top: 4px;">Нужно докупить: ${recipe.missing_ingredients.join(", ")}</div>`
              : `<div class="recipe-match" style="color: #43a047; margin-top: 4px;">Все продукты есть!</div>`;

          card.innerHTML = `
                    <div class="recipe-title">${recipe.name}</div>
                    <div class="recipe-match">Совпадение: ~${recipe.match_percentage}%</div>
                    ${missingText}
                    <details>
                        <summary>Показать рецепт 📖</summary>
                        <ol>${stepsHtml}</ol>
                    </details>
                `;
          listContainer.appendChild(card);
        });
      }

      function showIngredientsScreen() {
        document.getElementById("recipes-screen").classList.add("hidden");
        document
          .getElementById("ingredients-screen")
          .classList.remove("hidden");
        updateButtons();
      }

      renderIngredients();
    </script>
  </body>
</html>
