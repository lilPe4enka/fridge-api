<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Что в холодильнике?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        margin: 0;
        padding: 20px 16px;
      }

      h2,
      h3 {
        text-align: center;
        margin-top: 0;
      }

      /* Блок выбора времени */
      .time-filters {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .time-btn {
        background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        color: var(--tg-theme-text-color, #000000);
        border: none;
        padding: 8px 14px;
        border-radius: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .time-btn.active {
        background-color: var(--tg-theme-button-color, #3390ec);
        color: #fff;
      }

      /* Плитки продуктов */
      #ingredients-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .ingredient-tile {
        background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        transition: 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .ingredient-tile.selected {
        background-color: var(--tg-theme-button-color, #3390ec);
        color: #fff;
        transform: scale(1.05);
      }

      /* Рецепты */
      .recipe-card {
        background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
        position: relative;
      }
      .recipe-title {
        font-weight: 700;
        font-size: 19px;
        margin-bottom: 8px;
        padding-right: 40px;
      }

      /* КБЖУ и Время */
      .badges-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .badge {
        background: rgba(0, 0, 0, 0.05);
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: bold;
      }
      .badge.time {
        background: #ffe0b2;
        color: #e65100;
      }

      /* Шаги */
      details {
        margin-top: 14px;
        background: rgba(0, 0, 0, 0.03);
        padding: 10px;
        border-radius: 12px;
      }
      summary {
        color: var(--tg-theme-link-color, #3390ec);
        font-weight: 600;
        outline: none;
      }
      ol {
        padding-left: 20px;
        margin-top: 10px;
        font-size: 14px;
      }

      /* Кнопки действий в карточке */
      .action-buttons {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .action-btn {
        flex: 1;
        border: none;
        padding: 10px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        background-color: var(--tg-theme-button-color, #3390ec);
        color: #fff;
      }
      .action-btn.secondary {
        background-color: rgba(0, 0, 0, 0.1);
        color: var(--tg-theme-text-color);
      }
      .fav-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
      }

      /* Экран загрузки с котом */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--tg-theme-bg-color, #ffffff);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #loading-overlay img {
        width: 200px;
        border-radius: 20px;
        margin-bottom: 20px;
      }
      #loading-overlay p {
        font-size: 18px;
        font-weight: bold;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }
      .top-nav {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .top-nav button {
        background: none;
        border: 1px solid var(--tg-theme-button-color);
        color: var(--tg-theme-button-color);
        padding: 6px 12px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-overlay" class="hidden">
      <img src="cat.gif" alt="Кот готовит" />
      <p>
        Ищу самые вкусные рецепты...<br /><span
          style="font-size: 14px; font-weight: normal; color: gray"
          >Это займет пару секунд 🪄</span
        >
      </p>
    </div>

    <!-- ЭКРАН 1: ВЫБОР -->
    <div id="ingredients-screen">
      <div class="top-nav">
        <h2>Что в холодильнике?</h2>
        <button onclick="showFavorites()">❤️ Избранное</button>
      </div>

      <h3>Сколько есть времени?</h3>
      <div class="time-filters">
        <button class="time-btn" onclick="setTime('15')">15 мин</button>
        <button class="time-btn" onclick="setTime('30')">30 мин</button>
        <button class="time-btn active" onclick="setTime('any')">
          Неважно
        </button>
      </div>

      <div id="ingredients-list"></div>
    </div>

    <!-- ЭКРАН 2: РЕЗУЛЬТАТЫ -->
    <div id="recipes-screen" class="hidden">
      <h2>Идеи для ужина 🍳</h2>
      <div id="recipes-list"></div>
      <button
        class="action-btn"
        style="width: 100%; margin-top: 16px"
        onclick="showIngredientsScreen()"
      >
        🔙 Выбрать другие продукты
      </button>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("bg_color");

      const AVAILABLE_INGREDIENTS = [
        { id: 1, name: "Яйца 🥚" },
        { id: 3, name: "Масло 🧈" },
        { id: 4, name: "Мука 🌾" },
        { id: 5, name: "Картошка 🥔" },
        { id: 6, name: "Лук 🧅" },
        { id: 7, name: "Курица 🍗" },
        { id: 8, name: "Макароны 🍝" },
        { id: 9, name: "Сыр 🧀" },
        { id: 10, name: "Молоко 🥛" },
        { id: 11, name: "Морковь 🥕" },
        { id: 12, name: "Чеснок 🧄" },
        { id: 13, name: "Рис 🍚" },
        { id: 15, name: "Мясной фарш 🥩" },
        { id: 16, name: "Сметана 🥣" },
        { id: 17, name: "Капуста 🥬" },
        { id: 18, name: "Болгарский перец 🫑" },
        { id: 19, name: "Огурцы 🥒" },
        { id: 20, name: "Зелень 🌿" },
        { id: 21, name: "Ветчина 🥓" },
        { id: 22, name: "Свинина 🥩" },
        { id: 23, name: "Гречка 🟤" },
        { id: 24, name: "Говядина 🥩" },
      ];

      let selectedIngredients = new Set();
      let selectedTime = "any";
      let currentRecipes = []; // Хранит загруженные сейчас рецепты
      let favoriteRecipes = []; // Хранит избранное из облака

      // Загрузка избранного из облака Telegram при старте
      tg.CloudStorage.getItem("fav_recipes", (err, val) => {
        if (!err && val) {
          try {
            favoriteRecipes = JSON.parse(val);
          } catch (e) {}
        }
      });

      // Время
      function setTime(val) {
        selectedTime = val;
        document
          .querySelectorAll(".time-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      // Рендер продуктов
      function renderIngredients() {
        const listContainer = document.getElementById("ingredients-list");
        AVAILABLE_INGREDIENTS.forEach((ingredient) => {
          const tile = document.createElement("div");
          tile.className = "ingredient-tile";
          tile.innerText = ingredient.name;
          tile.addEventListener("click", () => {
            if (selectedIngredients.has(ingredient.id)) {
              selectedIngredients.delete(ingredient.id);
              tile.classList.remove("selected");
            } else {
              selectedIngredients.add(ingredient.id);
              tile.classList.add("selected");
              tg.HapticFeedback.selectionChanged();
            }
            updateMainButton();
          });
          listContainer.appendChild(tile);
        });
      }

      function updateMainButton() {
        if (selectedIngredients.size > 0) {
          tg.MainButton.text = `Найти рецепты (${selectedIngredients.size})`;
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }

      // Поиск (Обращение к API)
      async function performSearch() {
        document.getElementById("loading-overlay").classList.remove("hidden");
        tg.MainButton.hide();

        try {
          // ВАЖНО: ВАША ССЫЛКА НА RENDER
          const response = await fetch(
            "https://fridge-api-a3wl.onrender.com/api/find-recipes",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ingredient_ids: Array.from(selectedIngredients),
                time_limit: selectedTime,
              }),
            },
          );

          const data = await response.json();
          currentRecipes = data.recipes;
          renderRecipes(currentRecipes, "recipes-list", false);

          document.getElementById("ingredients-screen").classList.add("hidden");
          document.getElementById("recipes-screen").classList.remove("hidden");
          tg.HapticFeedback.notificationOccurred("success");
        } catch (error) {
          tg.showAlert("Ошибка связи с сервером.");
        } finally {
          document.getElementById("loading-overlay").classList.add("hidden");
        }
      }
      tg.MainButton.onClick(() => {
        if (
          !document
            .getElementById("loading-overlay")
            .classList.contains("hidden")
        )
          return;
        performSearch();
      });

      // Рендер рецептов (используется и для поиска, и для Избранного)
      function renderRecipes(recipes, containerId, isFavoritesTab) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; 
            if (recipes.length === 0) { 
                container.innerHTML = '<p style="text-align:center; margin-top:30px;">Ничего не найдено 😔</p>'; 
                return; 
            }

            recipes.forEach((recipe, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                const stepsHtml = (recipe.steps || []).map(step => `<li>${step}</li>`).join('');
                const missingHtml = (recipe.missing_ingredients && recipe.missing_ingredients.length > 0 && !isFavoritesTab)
                    ? `<div style="color: #e53935; font-size:13px; margin-bottom:8px;">🛒 Докупить: <b>${recipe.missing_ingredients.join(', ')}</b></div>` 
                    : '';

                const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
                const isFav = favoriteRecipes.some(r => r.name === recipe.name);

                card.innerHTML = `
                    <button class="fav-btn" onclick="toggleFavorite(${index}, this, ${isFavoritesTab})">${isFav ? '❤️' : '🤍'}</button>
                    <div class="recipe-title">${recipe.name}</div>
                    
                    <div class="badges-row">
                        <span class="badge time">⏱ ${recipe.time || '? мин'}</span>
                        <span class="badge">🔥 ${m.kcal} ккал</span>
                        <span class="badge">Б: ${m.protein}г</span>
                        <span class="badge">Ж: ${m.fat}г</span>
                        <span class="badge">У: ${m.carbs}г</span>
                    </div>
                    ${missingHtml}
                    
                    <details><summary>Показать рецепт</summary><ol>${stepsHtml}</ol></details>
                    
                    <div class="action-buttons">
                        <!-- Новая кнопка отправки в бота -->
                        <button class="action-btn secondary" onclick="sendToBot(${index}, ${isFavoritesTab})">📨 Отправить мне в чат</button>
                        <button class="action-btn" onclick="shareRecipe(${index}, ${isFavoritesTab})">✈️ Поделиться</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // НОВАЯ ФУНКЦИЯ: Отправка рецепта и списка покупок прямо в чат с ботом
        async function sendToBot(index, fromFavorites) {
            const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
            const userId = tg.initDataUnsafe?.user?.id; // Получаем ID пользователя из Telegram API
            
            if (!userId) {
                tg.showAlert("Не удалось определить ваш Telegram ID. Откройте приложение с телефона.");
                return;
            }

            // Формируем красивый текст сообщения
            const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
            let text = `👨‍🍳 *${recipe.name}*\n`;
            text += `⏱ ${recipe.time || '? мин'} | 🔥 ${m.kcal} ккал\n(Белки: ${m.protein}г | Жиры: ${m.fat}г | Углеводы: ${m.carbs}г)\n\n`;
            
            text += `*Шаги приготовления:*\n`;
            (recipe.steps || []).forEach((step, i) => { text += `${i+1}. ${step}\n`; });

            // Если есть продукты, которые нужно докупить, добавляем их в самый низ
            if (recipe.missing_ingredients && recipe.missing_ingredients.length > 0) {
                text += `\n🛒 *Нужно докупить:*\n- ${recipe.missing_ingredients.join("\n- ")}`;
            }

            tg.MainButton.showProgress();

            try {
                const response = await fetch('https://fridge-api-a3wl.onrender.com/api/send-to-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, text: text })
                });
                
                const result = await response.json();
                if (result.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert("Рецепт и список покупок отправлены вам в чат! 🚀");
                    // Можно раскомментировать строку ниже, чтобы приложение сразу закрывалось после отправки:
                    // tg.close();
                } else {
                    tg.showAlert("Ошибка при отправке: " + (result.error || "Неизвестная ошибка"));
                }
            } catch (error) {
                tg.showAlert("Ошибка сети при отправке в чат.");
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        function shareRecipe(index, fromFavorites) {
            const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
            const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
            let text = `👨‍🍳 *${recipe.name}*\n⏱ ${recipe.time} | 🔥 ${m.kcal} ккал\n\nШаги приготовления:\n` + recipe.steps.map((s,i) => `${i+1}. ${s}`).join("\n");
            
            if (recipe.missing_ingredients && recipe.missing_ingredients.length > 0) {
                 text += `\n\n🛒 *Нужно докупить:*\n- ${recipe.missing_ingredients.join("\n- ")}`;
            }
            
            tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
        }

        function toggleFavorite(index, btnElement, fromFavorites) {
            const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
            const favIndex = favoriteRecipes.findIndex(r => r.name === recipe.name);
            
            if (favIndex > -1) {
                favoriteRecipes.splice(favIndex, 1);
                btnElement.innerText = '🤍';
                if (fromFavorites) showFavorites();
            } else {
                favoriteRecipes.push(recipe);
                btnElement.innerText = '❤️';
                tg.HapticFeedback.notificationOccurred('success');
            }
            tg.CloudStorage.setItem('fav_recipes', JSON.stringify(favoriteRecipes));
        }

        function showFavorites() {
            document.getElementById('ingredients-screen').classList.add('hidden');
            document.getElementById('recipes-screen').classList.remove('hidden');
            tg.MainButton.hide();
            document.querySelector('#recipes-screen h2').innerText = "❤️ Мои рецепты";
            renderRecipes(favoriteRecipes, 'recipes-list', true);
        }

        function showIngredientsScreen() {
            document.getElementById('recipes-screen').classList.add('hidden');
            document.getElementById('ingredients-screen').classList.remove('hidden');
            document.querySelector('#recipes-screen h2').innerText = "Идеи для ужина 🍳";
            updateMainButton();
        }

        renderIngredients();
    </script>
</body>
</html>
