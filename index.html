<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Что в холодильнике?</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        color: var(--tg-theme-text-color, #000000);
        margin: 0; padding: 20px 16px;
      }
      h2 { text-align: center; margin-top: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
      h3 { margin: 24px 0 12px 0; font-size: 16px; font-weight: 700; color: var(--tg-theme-text-color); }
      .instruction-text { text-align: center; font-size: 14px; color: var(--tg-theme-hint-color, #999); margin-bottom: 20px; line-height: 1.4; }
      
      /* === ПОЛЗУНКИ === */
      .slider-container { margin-bottom: 16px; background: var(--tg-theme-bg-color, #fff); padding: 16px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
      .slider-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; font-weight: 600; }
      .slider-value { color: var(--tg-theme-button-color, #3390ec); font-weight: 800; }
      
      input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
      input[type=range]:focus { outline: none; }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
        background: var(--tg-theme-button-color, #3390ec);
        cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(51,144,236,0.4);
      }
      input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: rgba(0,0,0,0.08); border-radius: 3px; }

      /* === РЕЖИМЫ ГОТОВКИ === */
      .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
      .mode-btn {
        background-color: var(--tg-theme-bg-color, #ffffff);
        border: 1px solid rgba(0,0,0,0.05); padding: 12px 10px; border-radius: 14px;
        font-size: 14px; font-weight: 600; color: var(--tg-theme-text-color);
        box-shadow: 0 2px 6px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s;
      }
      .mode-btn.active {
        background: linear-gradient(135deg, #3390ec, #287bde);
        color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(51,144,236,0.3);
      }

      /* === ПОИСК И КАТЕГОРИИ === */
      .search-box { width: 100%; padding: 14px 18px; margin-bottom: 16px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
      .search-box:focus { border-color: var(--tg-theme-button-color, #3390ec); box-shadow: 0 0 0 4px rgba(51, 144, 236, 0.15); }
      .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none; }
      .category-tabs::-webkit-scrollbar { display: none; }
      .cat-btn { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); border: 1px solid rgba(0,0,0,0.05); padding: 8px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
      .cat-btn.active { background-color: var(--tg-theme-text-color, #000); color: var(--tg-theme-bg-color, #fff); }

      /* === ПЛИТКИ === */
      #ingredients-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; }
      .ingredient-tile { background-color: var(--tg-theme-bg-color, #ffffff); padding: 12px 16px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); -webkit-tap-highlight-color: transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
      .ingredient-tile.included { background: linear-gradient(135deg, #3390ec, #287bde); color: #fff; transform: scale(1.05); box-shadow: 0 6px 16px rgba(51, 144, 236, 0.35); border-color: transparent; }
      .ingredient-tile.excluded { background: linear-gradient(135deg, #ff453a, #d32f2f); color: #fff; text-decoration: line-through; transform: scale(0.95); opacity: 0.85; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); border-color: transparent; }

      /* === РЕЦЕПТЫ === */
      .recipe-card { background-color: var(--tg-theme-bg-color, #ffffff); border-radius: 20px; padding: 20px; margin-bottom: 20px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); }
      .recipe-title { font-weight: 800; font-size: 20px; margin-bottom: 12px; padding-right: 40px; line-height: 1.3; }
      .badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      .badge { background: var(--tg-theme-secondary-bg-color, #f0f0f0); padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--tg-theme-text-color); }
      .badge.time { background: #fff0d4; color: #d97706; }
      .badge.kcal { background: #fee2e2; color: #dc2626; }
      details { margin-top: 16px; background: var(--tg-theme-secondary-bg-color, #f9f9f9); padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.03); }
      summary { color: var(--tg-theme-button-color, #3390ec); font-weight: 700; font-size: 15px; outline: none; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
      summary::-webkit-details-marker { display: none; }
      summary::after { content: '▼'; font-size: 12px; transition: 0.3s; }
      details[open] summary::after { transform: rotate(180deg); }
      ol { padding-left: 24px; margin-top: 12px; font-size: 14px; line-height: 1.6; color: var(--tg-theme-text-color); }
      ol li { margin-bottom: 8px; }
      
      .action-buttons { display: flex; gap: 10px; margin-top: 16px; }
      .action-btn { flex: 1; border: none; padding: 14px 12px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; }
      .action-btn.primary { background: linear-gradient(135deg, #3390ec, #287bde); color: #fff; box-shadow: 0 4px 12px rgba(51, 144, 236, 0.3); }
      .action-btn.secondary { background-color: var(--tg-theme-secondary-bg-color, #f0f0f0); color: var(--tg-theme-text-color); }
      .action-btn.warning { background: linear-gradient(135deg, #ff9800, #e68900); color: #fff; box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3); }
      .action-btn:active { transform: translateY(2px); }
      .fav-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 26px; cursor: pointer; transition: 0.2s; }
      .fav-btn:active { transform: scale(1.2); }

      #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
      #loading-overlay img { width: 180px; border-radius: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      #loading-overlay p { font-size: 18px; font-weight: 800; text-align: center; line-height: 1.4; color: #000; }
      .hidden { display: none !important; }
      .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .top-nav h2 { margin: 0; }
      .top-nav button { background: var(--tg-theme-bg-color, #fff); border: 1px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(51, 144, 236, 0.1); }
      .nav-buttons-container { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <!-- Загрузка -->
    <div id="loading-overlay" class="hidden">
      <img src="cat.gif" alt="Кот готовит" />
      <p>Шеф-повар думает...<br /><span style="font-size: 14px; font-weight: 500; color: gray">Учитываем ваши вкусы 🪄</span></p>
    </div>

    <!-- ЭКРАН 1: ПРОДУКТЫ -->
    <div id="ingredients-screen">
      <div class="top-nav">
        <h2>Холодильник</h2>
        <button onclick="showFavorites()">❤️ Избранное</button>
      </div>
      
      <!-- СЛАЙДЕРЫ НАСТРОЕК -->
      <div class="slider-container">
        <div class="slider-header">
          <span>⏳ Время готовки</span>
          <span class="slider-value" id="timeLabel">45 мин</span>
        </div>
        <input type="range" id="timeSlider" min="10" max="120" step="5" value="45" oninput="updateSliders()">
      </div>

      <div class="slider-container">
        <div class="slider-header">
          <span>🔥 Калории (на порцию)</span>
          <span class="slider-value" id="kcalLabel">до 600 ккал</span>
        </div>
        <input type="range" id="kcalSlider" min="200" max="1500" step="50" value="600" oninput="updateSliders()">
      </div>
      
      <!-- РЕЖИМЫ ГОТОВКИ -->
      <h3>Стиль рецепта:</h3>
      <div class="mode-grid">
        <button class="mode-btn active" id="mode-standard" onclick="setMode('standard')">🍽 Обычный</button>
        <button class="mode-btn" id="mode-student" onclick="setMode('student')">🎓 Студент (в 1 посуде)</button>
        <button class="mode-btn" id="mode-chef" onclick="setMode('chef')">👨‍🍳 Режим Шефа</button>
        <button class="mode-btn" id="mode-kids" onclick="setMode('kids')">👶 Детское меню</button>
      </div>

      <h3>Продукты:</h3>
      <p class="instruction-text">Нажмите 1 раз: <b>добавить</b>. Нажмите 2 раза: <b>исключить</b> 🚫.</p>

      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Найти продукт..." oninput="filterIngredients()">
      
      <div class="category-tabs">
        <button class="cat-btn active" onclick="setCategory('all', this)">Все</button>
        <button class="cat-btn" onclick="setCategory('meat', this)">🥩 Мясо и Птица</button>
        <button class="cat-btn" onclick="setCategory('mince', this)">🥩 Фарш</button>
        <button class="cat-btn" onclick="setCategory('sausage', this)">🌭 Колбасы</button>
        <button class="cat-btn" onclick="setCategory('fish', this)">🐟 Рыба</button>
        <button class="cat-btn" onclick="setCategory('dairy', this)">🥛 Молочка и Сыр</button>
        <button class="cat-btn" onclick="setCategory('veg', this)">🥔 Овощи</button>
        <button class="cat-btn" onclick="setCategory('grocery', this)">🍝 Бакалея</button>
        <button class="cat-btn" onclick="setCategory('sauce', this)">🥫 Соусы и Добавки</button>
      </div>

      <div id="ingredients-list"></div>
    </div>

    <!-- ЭКРАН 2: РЕЦЕПТЫ -->
    <div id="recipes-screen" class="hidden">
      <h2 style="text-align: left; margin-bottom: 20px;">Идеи для ужина 🍳</h2>
      <div id="recipes-list"></div>
      
      <div class="nav-buttons-container">
        <button id="regen-btn" class="action-btn warning" onclick="performSearch()">🔄 Придумать другие рецепты</button>
        <button class="action-btn secondary" onclick="showIngredientsScreen()">🔙 Изменить продукты</button>
      </div>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor("bg_color");

      const AVAILABLE_INGREDIENTS = [
        { id: 54, name: "Куриное филе 🍗", cat: "meat" }, { id: 55, name: "Бедра / Голени 🍗", cat: "meat" },
        { id: 56, name: "Крылышки 🍗", cat: "meat" }, { id: 57, name: "Целая курица 🍗", cat: "meat" },
        { id: 58, name: "Свиная шея 🥩", cat: "meat" }, { id: 59, name: "Свиная вырезка 🥩", cat: "meat" },
        { id: 60, name: "Свиные ребра 🥩", cat: "meat" }, { id: 61, name: "Говядина мякоть 🥩", cat: "meat" },
        { id: 62, name: "Стейк говяжий 🥩", cat: "meat" },
        { id: 63, name: "Куриный фарш 🥩", cat: "mince" }, { id: 64, name: "Говяжий фарш 🥩", cat: "mince" },
        { id: 65, name: "Свиной фарш 🥩", cat: "mince" }, { id: 66, name: "Домашний фарш 🥩", cat: "mince" },
        { id: 35, name: "Сосиски / Сардельки 🌭", cat: "sausage" }, { id: 44, name: "Колбаса 🥓", cat: "sausage" },
        { id: 21, name: "Ветчина 🥓", cat: "sausage" }, { id: 28, name: "Бекон 🥓", cat: "sausage" },
        { id: 29, name: "Красная рыба 🐟", cat: "fish" }, { id: 67, name: "Белая рыба 🐟", cat: "fish" },
        { id: 30, name: "Креветки 🍤", cat: "fish" }, { id: 46, name: "Краб. палочки 🦀", cat: "fish" },
        { id: 50, name: "Рыб. консервы 🥫", cat: "fish" },
        { id: 1, name: "Яйца 🥚", cat: "dairy" }, { id: 9, name: "Твердый сыр 🧀", cat: "dairy" },
        { id: 68, name: "Моцарелла 🧀", cat: "dairy" }, { id: 69, name: "Плавленый сырок 🧀", cat: "dairy" },
        { id: 33, name: "Творог 🧀", cat: "dairy" }, { id: 10, name: "Молоко 🥛", cat: "dairy" },
        { id: 16, name: "Сметана 🥣", cat: "dairy" }, { id: 27, name: "Сливки 🥛", cat: "dairy" },
        { id: 42, name: "Кефир 🥛", cat: "dairy" }, { id: 3, name: "Слив. масло 🧈", cat: "dairy" },
        { id: 53, name: "Сгущенка 🥫", cat: "dairy" },
        { id: 5, name: "Картошка 🥔", cat: "veg" }, { id: 6, name: "Лук репчатый 🧅", cat: "veg" },
        { id: 73, name: "Зеленый лук 🧅", cat: "veg" }, { id: 11, name: "Морковь 🥕", cat: "veg" },
        { id: 12, name: "Чеснок 🧄", cat: "veg" }, { id: 25, name: "Помидоры 🍅", cat: "veg" },
        { id: 19, name: "Свежие огурцы 🥒", cat: "veg" }, { id: 75, name: "Соленые огурцы 🥒", cat: "veg" },
        { id: 18, name: "Болгарский перец 🫑", cat: "veg" }, { id: 70, name: "Кабачки 🥒", cat: "veg" },
        { id: 71, name: "Баклажаны 🍆", cat: "veg" }, { id: 17, name: "Капуста 🥬", cat: "veg" },
        { id: 37, name: "Брокколи / Цветная 🥦", cat: "veg" }, { id: 72, name: "Свекла 🍠", cat: "veg" },
        { id: 26, name: "Грибы 🍄", cat: "veg" }, { id: 20, name: "Зелень 🌿", cat: "veg" },
        { id: 8, name: "Макароны 🍝", cat: "grocery" }, { id: 13, name: "Рис 🍚", cat: "grocery" },
        { id: 23, name: "Гречка 🟤", cat: "grocery" }, { id: 41, name: "Овсянка 🥣", cat: "grocery" },
        { id: 4, name: "Мука 🌾", cat: "grocery" }, { id: 34, name: "Хлеб / Батон 🍞", cat: "grocery" },
        { id: 74, name: "Лаваш / Тортилья 🌯", cat: "grocery" }, { id: 45, name: "Пельмени 🥟", cat: "grocery" },
        { id: 49, name: "Заморож. овощи 🥦", cat: "grocery" },
        { id: 40, name: "Раст. масло 🌻", cat: "sauce" }, { id: 38, name: "Майонез 🥣", cat: "sauce" },
        { id: 39, name: "Кетчуп / Паста 🍅", cat: "sauce" }, { id: 43, name: "Соевый соус 🥢", cat: "sauce" },
        { id: 51, name: "Горчица 🌭", cat: "sauce" }, { id: 36, name: "Фасоль консерв. 🫘", cat: "sauce" },
        { id: 47, name: "Кукуруза 🌽", cat: "sauce" }, { id: 48, name: "Горошек 🫛", cat: "sauce" },
        { id: 76, name: "Мёд 🍯", cat: "sauce" }, { id: 31, name: "Лимон 🍋", cat: "sauce" },
        { id: 32, name: "Яблоки 🍏", cat: "sauce" }, { id: 52, name: "Сахар 🧊", cat: "sauce" }
      ];

      // === ИНИЦИАЛИЗАЦИЯ И СОХРАНЕНИЕ СОСТОЯНИЯ (localStorage) ===
      let savedState = JSON.parse(localStorage.getItem('fridgeState') || '{}');
      let ingredientStates = savedState.ingredients || {}; 
      let cookingMode = savedState.mode || 'standard';
      let currentCategory = 'all'; 
      let currentRecipes = []; 
      let favoriteRecipes = [];

      // Восстанавливаем слайдеры при загрузке
      document.getElementById('timeSlider').value = savedState.time || 45;
      document.getElementById('kcalSlider').value = savedState.kcal || 600;

      function saveState() {
          localStorage.setItem('fridgeState', JSON.stringify({
              ingredients: ingredientStates,
              time: document.getElementById('timeSlider').value,
              kcal: document.getElementById('kcalSlider').value,
              mode: cookingMode
          }));
      }

      tg.CloudStorage.getItem("fav_recipes", (err, val) => {
        if (!err && val) { try { favoriteRecipes = JSON.parse(val); } catch (e) {} }
      });

      // Обновление UI слайдеров
      function updateSliders() {
          let timeVal = document.getElementById('timeSlider').value;
          let kcalVal = document.getElementById('kcalSlider').value;
          document.getElementById('timeLabel').innerText = timeVal + " мин";
          document.getElementById('kcalLabel').innerText = "до " + kcalVal + " ккал";
          saveState();
      }
      
      // Установка режима готовки
      function setMode(mode) {
          cookingMode = mode;
          document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
          document.getElementById(`mode-${mode}`).classList.add('active');
          saveState();
      }

      function filterIngredients() { renderIngredients(); }

      function setCategory(cat, btnElement) {
        currentCategory = cat;
        document.querySelectorAll(".cat-btn").forEach((btn) => btn.classList.remove("active"));
        btnElement.classList.add("active");
        renderIngredients();
      }

      function renderIngredients() {
        const listContainer = document.getElementById("ingredients-list");
        listContainer.innerHTML = '';
        
        const searchQuery = document.getElementById("searchInput").value.toLowerCase();

        AVAILABLE_INGREDIENTS.forEach((ingredient) => {
          if (currentCategory !== 'all' && ingredient.cat !== currentCategory) return;
          if (searchQuery && !ingredient.name.toLowerCase().includes(searchQuery)) return;

          const tile = document.createElement("div");
          tile.className = "ingredient-tile";
          tile.innerText = ingredient.name;
          
          let currentState = ingredientStates[ingredient.id] || 0;
          if (currentState === 1) tile.classList.add("included");
          if (currentState === 2) tile.classList.add("excluded");
          
          tile.addEventListener("click", () => {
            let state = ingredientStates[ingredient.id] || 0;
            if (state === 0) {
                ingredientStates[ingredient.id] = 1;
                tile.classList.add("included");
                tile.classList.remove("excluded");
            } else if (state === 1) {
                ingredientStates[ingredient.id] = 2;
                tile.classList.remove("included");
                tile.classList.add("excluded");
            } else {
                ingredientStates[ingredient.id] = 0;
                tile.classList.remove("excluded");
            }
            tg.HapticFeedback.selectionChanged();
            updateMainButton();
            saveState(); // Сохраняем каждый клик
          });
          
          listContainer.appendChild(tile);
        });

        if (listContainer.innerHTML === '') {
            listContainer.innerHTML = '<p style="color: #999; text-align: center; width: 100%; margin-top: 20px;">Продукты не найдены 🤷‍♂️</p>';
        }
      }

      function updateMainButton() {
        let incCount = 0;
        let excCount = 0;
        for (let id in ingredientStates) {
            if (ingredientStates[id] === 1) incCount++;
            if (ingredientStates[id] === 2) excCount++;
        }

        if (incCount > 0) {
          let text = `Найти рецепты (${incCount} ➕`;
          if (excCount > 0) text += `, ${excCount} ➖`;
          text += `)`;
          tg.MainButton.text = text;
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }

      async function performSearch() {
        document.getElementById("loading-overlay").classList.remove("hidden");
        tg.MainButton.hide();

        let includedIds = [];
        let excludedIds = [];
        for (let id in ingredientStates) {
            if (ingredientStates[id] === 1) includedIds.push(parseInt(id));
            if (ingredientStates[id] === 2) excludedIds.push(parseInt(id));
        }

        let timeVal = document.getElementById('timeSlider').value;
        let kcalVal = document.getElementById('kcalSlider').value;

        try {
          const response = await fetch("https://fridge-api-a3wl.onrender.com/api/find-recipes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ingredient_ids: includedIds,
              excluded_ids: excludedIds,
              time_limit: parseInt(timeVal),
              calorie_limit: parseInt(kcalVal),
              cooking_mode: cookingMode
            }),
          });
          const data = await response.json();
          currentRecipes = data.recipes || [];
          renderRecipes(currentRecipes, "recipes-list", false);

          document.getElementById("ingredients-screen").classList.add("hidden");
          document.getElementById("recipes-screen").classList.remove("hidden");
          
          document.querySelector('#recipes-screen h2').innerText = "Идеи для ужина 🍳";
          document.getElementById("regen-btn").classList.remove("hidden");
          
          tg.HapticFeedback.notificationOccurred("success");
        } catch (error) {
          tg.showAlert("Ошибка связи с сервером. Попробуйте еще раз.");
        } finally {
          document.getElementById("loading-overlay").classList.add("hidden");
        }
      }

      tg.MainButton.onClick(() => {
        if (!document.getElementById("loading-overlay").classList.contains("hidden")) return;
        performSearch();
      });

      function renderRecipes(recipes, containerId, isFavoritesTab) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; 
        if (recipes.length === 0) { 
            container.innerHTML = '<p style="text-align:center; margin-top:40px; font-size: 16px; color: #666;">Ничего не найдено 😔</p>'; 
            return; 
        }

        recipes.forEach((recipe, index) => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            const stepsHtml = (recipe.steps || []).map(step => `<li>${step}</li>`).join('');
            const missingHtml = (recipe.missing_ingredients && recipe.missing_ingredients.length > 0 && !isFavoritesTab)
                ? `<div style="background: #fff0f0; border-left: 4px solid #ff453a; padding: 10px; border-radius: 8px; color: #d32f2f; font-size:13px; margin-bottom:12px;">🛒 <b>Нужно докупить:</b><br>${recipe.missing_ingredients.join(', ')}</div>` 
                : '';
            const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
            const isFav = favoriteRecipes.some(r => r.name === recipe.name);

            card.innerHTML = `
                <button class="fav-btn" onclick="toggleFavorite(${index}, this, ${isFavoritesTab})">${isFav ? '❤️' : '🤍'}</button>
                <div class="recipe-title">${recipe.name}</div>
                <div class="badges-row">
                    <span class="badge time">⏱ ${recipe.time || '? мин'}</span>
                    <span class="badge kcal">🔥 ${m.kcal} ккал</span>
                    <span class="badge">Б: ${m.protein}г</span>
                    <span class="badge">Ж: ${m.fat}г</span>
                    <span class="badge">У: ${m.carbs}г</span>
                </div>
                ${missingHtml}
                <details><summary>Показать рецепт</summary><ol>${stepsHtml}</ol></details>
                <div class="action-buttons">
                    <button class="action-btn primary" onclick="sendToBot(${index}, ${isFavoritesTab})">📨 Отправить в чат</button>
                    <button class="action-btn secondary" onclick="shareRecipe(${index}, ${isFavoritesTab})">✈️ Поделиться</button>
                </div>
            `;
            container.appendChild(card);
        });
      }

      async function sendToBot(index, fromFavorites) {
        const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
        const userId = tg.initDataUnsafe?.user?.id; 
        if (!userId) { tg.showAlert("Откройте приложение с телефона."); return; }

        const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
        
        let text = `👨‍🍳 <b>${recipe.name}</b>\n`;
        text += `⏱ ${recipe.time || '? мин'} | 🔥 ${m.kcal} ккал\n(Белки: ${m.protein}г | Жиры: ${m.fat}г | Углеводы: ${m.carbs}г)\n\n`;
        text += `<b>Шаги приготовления:</b>\n`;
        (recipe.steps || []).forEach((step, i) => { text += `${i+1}. ${step}\n`; });
        
        if (recipe.missing_ingredients && recipe.missing_ingredients.length > 0) {
            text += `\n🛒 <b>Нужно докупить:</b>\n- ${recipe.missing_ingredients.join("\n- ")}`;
        }

        tg.MainButton.showProgress();
        try {
            const response = await fetch('https://fridge-api-a3wl.onrender.com/api/send-to-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, text: text })
            });
            
            if (!response.ok) {
                 throw new Error(`Сбой на сервере (${response.status})`);
            }
            
            const result = await response.json();
            
            if (result.success) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("Рецепт отправлен вам в чат! 🚀");
            } else {
                tg.showAlert("Ошибка Telegram: " + (result.error || "Неизвестная ошибка"));
            }
        } catch (error) {
            tg.showAlert("Ошибка отправки: " + error.message);
        } finally {
            tg.MainButton.hideProgress();
        }
      }

      function shareRecipe(index, fromFavorites) {
        const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
        const m = recipe.macros || {kcal:0, protein:0, fat:0, carbs:0};
        let text = `👨‍🍳 *${recipe.name}*\n⏱ ${recipe.time} | 🔥 ${m.kcal} ккал\n\nШаги приготовления:\n` + recipe.steps.map((s,i) => `${i+1}. ${s}`).join("\n");
        if (recipe.missing_ingredients && recipe.missing_ingredients.length > 0) {
             text += `\n\n🛒 *Нужно докупить:*\n- ${recipe.missing_ingredients.join("\n- ")}`;
        }
        tg.openTelegramLink(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`);
      }

      function toggleFavorite(index, btnElement, fromFavorites) {
        const recipe = fromFavorites ? favoriteRecipes[index] : currentRecipes[index];
        const favIndex = favoriteRecipes.findIndex(r => r.name === recipe.name);
        if (favIndex > -1) {
            favoriteRecipes.splice(favIndex, 1);
            btnElement.innerText = '🤍';
            if (fromFavorites) showFavorites();
        } else {
            favoriteRecipes.push(recipe);
            btnElement.innerText = '❤️';
            tg.HapticFeedback.notificationOccurred('success');
        }
        tg.CloudStorage.setItem('fav_recipes', JSON.stringify(favoriteRecipes));
      }

      function showFavorites() {
        document.getElementById('ingredients-screen').classList.add('hidden');
        document.getElementById('recipes-screen').classList.remove('hidden');
        tg.MainButton.hide();
        
        document.querySelector('#recipes-screen h2').innerText = "❤️ Мои рецепты";
        document.getElementById('regen-btn').classList.add('hidden');
        
        renderRecipes(favoriteRecipes, 'recipes-list', true);
      }

      function showIngredientsScreen() {
        document.getElementById('recipes-screen').classList.add('hidden');
        document.getElementById('ingredients-screen').classList.remove('hidden');
        updateMainButton();
      }

      // Запуск
      updateSliders();
      setMode(cookingMode);
    </script>
  </body>
</html>
